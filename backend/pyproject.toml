[project]
name = "backend"
version = "0.1.0"
description = "API Flask de Rehoboth Church International (Supabase / PostgREST)"
readme = "README.md"
requires-python = ">=3.11"
# Doit rester aligne sur requirements.txt : Railway construit avec Nixpacks,
# qui installe depuis requirements.txt, pas depuis ce fichier.
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-limiter>=3.8.0",
    "gunicorn>=26.0.0",
    "pydantic[email]>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "resend>=2.32.2",
    "supabase>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Sans testpaths, `pytest` sans argument ramasse aussi scratch/ (scripts
# d'administration jetables, non versionnes) et echoue a la collecte.
testpaths = ["tests"]
